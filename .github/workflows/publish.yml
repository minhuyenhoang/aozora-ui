name: Publish to npm

on:
  # Publishes when a release is published on GitHub.
  release:
    types: [published]
  # Lets the workflow be started by hand from the Actions tab.
  workflow_dispatch:

# Publishing uses the npm token. pnpm also uses GitHub OIDC to generate package
# provenance, so the job must be allowed to request an identity token.
permissions:
  contents: read
  id-token: write

# Never publishes the same package twice at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          # Points the publish step at the npm registry. pnpm installs from
          # this same registry, so one publish serves npm and pnpm users.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release tagged v1.2.3 must match version 1.2.3 in package.json.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($version)."
            exit 1
          fi

      - name: Configure npm authentication
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The NPM_TOKEN repository secret is not configured."
            exit 1
          fi
          pnpm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publishing runs `prepublishOnly` (type check and lint) and `prepack`
      # (build) first, so a broken package is not published.
      - name: Publish with pnpm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
