name: Publish to npm

on:
  # Publishes when a release is published on GitHub.
  release:
    types: [published]
  # Lets the workflow be started by hand from the Actions tab.
  workflow_dispatch:

# Publishing uses the npm token. pnpm also uses GitHub OIDC to generate package
# provenance, so the job must be allowed to request an identity token.
permissions:
  contents: read
  id-token: write

# Never publishes the same package twice at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm token is stored as the NPM_TOKEN secret in this environment.
    environment: NODE_AUTH_TOKEN
    env:
      pnpm_config__auth: |
        {
          "https://registry.npmjs.org": {
            "@": {
              "authToken": ${{ toJSON(secrets.NPM_TOKEN) }}
            }
          }
        }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          cache: true
          require-lockfile: true

      # A release tagged v1.2.3 must match version 1.2.3 in package.json.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($version)."
            exit 1
          fi

      # Publishing runs `prepublishOnly` (type check and lint) and `prepack`
      # (build) first, so a broken package is not published.
      - name: Publish with pnpm
        run: pnpm publish --no-git-checks
